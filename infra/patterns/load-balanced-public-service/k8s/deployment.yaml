# 负载均衡公共服务 —— CCE 工作负载清单
# 等价原模式：ECS Fargate 服务 + Application Load Balancer + Cloud Map
# 部署：kubectl apply -f deployment.yaml
# 说明：Service 使用 CCE ELB 自动创建注解，由 CCE 控制面自动创建独享型 ELB 并绑定。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: default
  labels:
    app: web-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      containers:
        - name: web-frontend
          # 镜像地址在推送后由 SWR 返回，形如 swr.<region>.myhuaweicloud.com/<org>/web-frontend:latest
          image: swr.cn-north-4.myhuaweicloud.com/container-patterns/web-frontend:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: default
  annotations:
    # CCE 自动创建独享型 ELB（公网），并作为 Service 的负载均衡入口
    kubernetes.io/elb.class: union
    kubernetes.io/elb.autocreate: >-
      {
        "type": "public",
        "bandwidth_name": "web-frontend-bandwidth",
        "bandwidth_chargemode": "traffic",
        "bandwidth_size": 5,
        "bandwidth_sharetype": "PER",
        "eip_type": "5_bgp",
        "available_zone": ["cn-north-4a"]
      }
spec:
  type: LoadBalancer
  selector:
    app: web-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
